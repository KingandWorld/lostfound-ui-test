[pytest]
testpaths = testcases
python_files = test_*.py
addopts = -v --alluredir=./allure-results --clean-alluredir --reruns 1 --reruns-delay 1 --only-rerun "TimeoutError|net::ERR|ERR_CONNECTION"
markers =
    ui: UI 自动化用例（Day15 起）

# Day17 重试机制说明（pytest-rerunfailures，对应 week3_day17.md 任务三）：
# - --reruns 1 --reruns-delay 1：每条用例最多重试 1 次，间隔 1 秒；
# - --only-rerun "TimeoutError|net::ERR|ERR_CONNECTION"：只重试超时/网络连接类
#   波动（Playwright 定位超时、后端网络抖动），断言失败（AssertionError）不重试——
#   避免重试机制掩盖真实功能缺陷；
# - 重试时 function 级 fixture（page 等）会重新执行，登录态/上下文全新，不跨尝试复用。
